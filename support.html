<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>개발자 후원하기 · 단어왔어</title><meta name="description" content="무료 영어 단어 앱 단어왔어의 개발자를 응원하는 방법">
<style>
*{box-sizing:border-box}body{margin:0;background:#fcf8ee;color:#142943;font:17px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
header,main{width:min(100% - 40px,640px);margin:auto}header{padding:25px 0;border-bottom:1px solid #d6cdbb}a{color:#142943;text-underline-offset:5px}.brand{font-size:21px;font-weight:750;text-decoration:none}main{padding:clamp(48px,10vw,100px) 0}h1{margin:0 0 16px;font-size:clamp(32px,7vw,52px);line-height:1.2;letter-spacing:-.055em}p{margin:12px 0}.method{margin:32px 0;padding:20px 24px;background:#fffdf6;border-left:4px solid #b83726;border-radius:4px}.action{font:inherit;border:none;cursor:pointer;display:inline-block;background:#ad3526;color:white;border-radius:8px;padding:10px 18px;text-decoration:none;font-weight:650}button:focus-visible,a:focus-visible{outline:3px solid #227a9b;outline-offset:3px}
</style></head><body><header><a class="brand" href="index.html">단어왔어</a></header><main><h1>개발자 후원하기</h1><p>단어왔어가 영어 공부에 도움이 됐다면 개발을 응원해 주세요. 앱은 무료로 사용할 수 있어요.</p>
<section id="transfer" class="method" aria-label="계좌이체 후원">
<strong>계좌이체로 후원하기</strong>
<p><span id="bank">하나은행</span> · <span id="holder">원성완</span><br><b id="number">622-910785-74307</b></p>
<button class="action" type="button" id="copy">계좌번호 복사</button>
<p role="status" id="feedback"></p></section>
<script>
    document.getElementById("copy").addEventListener("click", async () => {
        const feedback = document.getElementById("feedback");
        try {
            await navigator.clipboard.writeText(document.getElementById("number").textContent);
            feedback.textContent = "계좌번호를 복사했어요. 은행 앱에서 이체할 수 있어요.";
        } catch {
            const range = document.createRange();
            range.selectNodeContents(document.getElementById("number"));
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            feedback.textContent = "위 계좌번호를 선택했어요. 복사해서 은행 앱에 붙여넣으세요.";
        }
    });
</script>
<a href="index.html">단어왔어 홈페이지로 돌아가기</a></main></body></html>
